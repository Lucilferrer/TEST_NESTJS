name: NESTJS Pipeline

on:
  push:
    branches: [ main, staging ]
 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4      
        with:
          node-version: 16

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install
      - name: Run tests
        run: |
          echo "Running tests..."
          npm test